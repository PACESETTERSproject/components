name: 📦 Release

# Push a tag matching package.json's version (e.g. v1.34.0) to publish a
# GitHub release with the npm tarball attached. Consumers install it with:
#   "@pacesetters/components": "https://github.com/PACESETTERSproject/components/releases/download/v1.34.0/pacesetters-components-1.34.0.tgz"

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: 📦 release
    runs-on: ubuntu-latest
    steps:
      - name: 🛠️ Prepare pnpm workspace
        uses: dyne/pnpm@main
        with:
          node-version: 20
          pnpm-version: 9
      - name: 🔖 Check tag matches package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: 🏗️ Build
        run: pnpm build
      - name: 📦 Pack
        run: pnpm pack
      - name: 🚀 Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" *.tgz --title "$GITHUB_REF_NAME" --generate-notes
